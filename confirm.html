<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#123b63">
<title>تأكيد البريد | Air Logistic</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f2f5f9;font-family:Tahoma,Arial,sans-serif;color:#172b45;padding:20px}.panel{width:min(100%,460px);background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:30px 24px;box-shadow:0 12px 40px #17324d12;text-align:center}.mark{width:58px;height:58px;border-radius:16px;background:#123b63;color:white;display:grid;place-items:center;margin:0 auto 18px;font-size:25px;font-weight:bold}.title{font-size:23px;margin:0 0 12px}.message{font-size:15px;line-height:1.9;color:#526176;margin:0}.status{margin-top:22px;padding:13px;border-radius:12px;background:#f1f5f9;font-size:14px;line-height:1.8}.status.ok{background:#ecfdf3;color:#176b46}.status.bad{background:#fff1f0;color:#b42318}.link{display:inline-block;margin-top:20px;padding:12px 20px;border-radius:10px;background:#123b63;color:white;text-decoration:none;font-weight:bold}.hidden{display:none}
</style>
</head>
<body>
<main class="panel">
<div class="mark">AL</div>
<h1 class="title">تأكيد البريد الإلكتروني</h1>
<p class="message">جاري التحقق من بريدك الإلكتروني لتفعيل حساب Air Logistic.</p>
<div id="status" class="status" role="status" aria-live="polite">جارٍ تأكيد البريد الإلكتروني، برجاء الانتظار…</div>
<a id="openApp" class="link hidden" href="./">فتح Air Logistic</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.min.js"></script>
<script>
(async function(){
  const statusEl=document.getElementById('status');
  const openApp=document.getElementById('openApp');
  const say=(message,kind)=>{statusEl.textContent=message;statusEl.className='status '+(kind||'');};
  try{
    const params=new URLSearchParams(location.search);
    const token_hash=params.get('token_hash');
    const type=params.get('type')||'signup';
    if(!token_hash){say('رابط التأكيد غير مكتمل. اطلب رسالة تأكيد جديدة من Air Logistic.','bad');return;}
    if(!window.supabase?.createClient){say('تعذر تحميل خدمة التحقق. تأكد من الإنترنت ثم أعد فتح الرابط.','bad');return;}
    const client=window.supabase.createClient(
      'https://jynzwuamihnwbbnvqlqw.supabase.co',
      'sb_publishable_4LoEfXDeogMpZ18AfQtz_Q_2zjBcyKi',
      {auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:false,flowType:'pkce'}}
    );
    const {data,error}=await client.auth.verifyOtp({token_hash,type});
    if(error||!data?.session){
      console.error('Air Logistic email confirmation failed:',error);
      say('تعذر تأكيد البريد. قد يكون الرابط منتهي الصلاحية أو استُخدم من قبل. ارجع للتطبيق واطلب رسالة تأكيد جديدة.','bad');
      return;
    }
    say('تم تأكيد البريد بنجاح. جارٍ فتح Air Logistic…','ok');
    openApp.classList.remove('hidden');
    setTimeout(()=>location.replace('./'),1200);
  }catch(error){
    console.error(error);
    say('حدث خطأ أثناء التأكيد. أعد المحاولة برسالة تأكيد جديدة.','bad');
  }
})();
</script>
</body>
</html>
